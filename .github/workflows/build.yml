name: Build Firmware

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Get current date
      id: date
      run: echo "DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.5.2
        target: esp32c3
        command: |
          pip install pyyaml jinja2 esptool
          BUILD_LOG=/tmp/build.log
          set +e
          idf.py build >"$BUILD_LOG" 2>&1
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "========= BUILD FAILED (rc=$RC) ========="
            echo ""
            echo "--- tail -800 of build log ---"
            tail -n 800 "$BUILD_LOG" || true
            echo ""
            echo "--- grep undefined reference / error: ---"
            grep -aE "undefined reference|error:|multiple definition" "$BUILD_LOG" | tail -n 100 || true
            echo ""
            echo "--- all log files in build/log: ---"
            find build/log -type f 2>/dev/null | head -20 || true
            for f in build/log/idf_py_stderr_output_* build/log/idf_py_stdout_output_* build/CMakeFiles/CMakeError.log build/CMakeFiles/CMakeOutput.log; do
              [ -f "$f" ] || continue
              echo ""
              echo "===== $f ====="
              tail -n 400 "$f" || true
            done
            echo ""
            echo "--- build.ninja link rules ---"
            grep -aE "link.*__idf_main" build/build.ninja 2>/dev/null | head -5 || true
            exit 1
          fi
          echo "BUILD OK"

    - name: Setup Python + esptool for host runner
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install esptool on host
      run: pip install --upgrade esptool

    - name: Merge BINs into single flash image and prepare output
      run: |
        set -e
        mkdir -p output

        echo "=== Checking build output ==="
        ls -la build/ || true
        ls -la build/bootloader/ || true
        ls -la build/partition_table/ || true

        test -f build/bootloader/bootloader.bin || { echo "ERROR: bootloader.bin not found"; exit 1; }
        test -f build/partition_table/partition-table.bin || { echo "ERROR: partition-table.bin not found"; exit 1; }
        test -f build/Top-AMS.bin || { echo "ERROR: Top-AMS.bin not found"; exit 1; }
        test -f build/flash_args || { echo "ERROR: flash_args not found"; exit 1; }

        echo ""
        echo "=== flash_args ==="
        cat build/flash_args
        echo ""

        FLASH_MODE="dio"
        FLASH_FREQ="80m"
        FLASH_SIZE="4MB"
        BOOTLOADER_OFF="0x0"
        PART_OFF="0x8000"
        APP_OFF="0x10000"

        echo "--- Parsing build/flash_args via awk ---"
        cat build/flash_args
        echo ""

        PARSED_TMP=$(mktemp)
        awk '
        {
            line = $0
            n = split(line, a, " ")
            mode = "dio"; freq = "80m"; size = "4MB"
            boot = ""; part = ""; app = ""
            for (i = 1; i <= n; i++) {
                t = a[i]
                if (t == "--flash_mode" && i+1 <= n) { mode = a[++i]; continue }
                if (t == "--flash_freq" && i+1 <= n) { freq = a[++i]; continue }
                if (t == "--flash_size" && i+1 <= n) { size = a[++i]; continue }
                if (t ~ /^0[xX][0-9a-fA-F]+$/ && i+1 <= n) {
                    addr = tolower(t); bin = a[++i]
                    bl = tolower(bin)
                    if (index(bl, "bootloader") > 0) boot = addr
                    else if (index(bl, "partition") > 0) part = addr
                    else if (match(bl, /\.bin$/)) app = addr
                }
            }
            printf("export FLASH_MODE=%s\n",     mode)
            printf("export FLASH_FREQ=%s\n",     freq)
            printf("export FLASH_SIZE=%s\n",     size)
            printf("export BOOTLOADER_OFF=%s\n", (boot == "" ? "0x0" : boot))
            printf("export PART_OFF=%s\n",       (part == "" ? "0x8000" : part))
            printf("export APP_OFF=%s\n",        (app  == "" ? "0x10000" : app))
        }' build/flash_args > "$PARSED_TMP"
        cat "$PARSED_TMP"
        . "$PARSED_TMP"
        rm -f "$PARSED_TMP"

        echo ""
        echo "Parsed: mode=$FLASH_MODE freq=$FLASH_FREQ size=$FLASH_SIZE boot=$BOOTLOADER_OFF part=$PART_OFF app=$APP_OFF"
        echo ""
        echo "=== Merging to single BIN ==="
        python -m esptool \
          --chip esp32c3 \
          merge_bin \
          -o output/Top-AMS-full.bin \
          --flash_mode "$FLASH_MODE" \
          --flash_freq "$FLASH_FREQ" \
          --flash_size "$FLASH_SIZE" \
          "$BOOTLOADER_OFF" build/bootloader/bootloader.bin \
          "$PART_OFF" build/partition_table/partition-table.bin \
          "$APP_OFF" build/Top-AMS.bin

        cp build/bootloader/bootloader.bin output/
        cp build/partition_table/partition-table.bin output/
        cp build/Top-AMS.bin output/
        cp build/flash_args output/

        {
          echo ""
          echo "## 拆分刷写参数（解析自 flash_args）："
          echo ""
          echo "BOOTLOADER_OFF=$BOOTLOADER_OFF"
          echo "PART_OFF=$PART_OFF"
          echo "APP_OFF=$APP_OFF"
          echo "FLASH_MODE=$FLASH_MODE"
          echo "FLASH_FREQ=$FLASH_FREQ"
          echo "FLASH_SIZE=$FLASH_SIZE"
        } > output/flash_vars.txt
        cat output/flash_vars.txt

        # 导出到 GITHUB_ENV，使后续 release body 可以使用
        {
          echo "FLASH_MODE=$FLASH_MODE"
          echo "FLASH_FREQ=$FLASH_FREQ"
          echo "FLASH_SIZE=$FLASH_SIZE"
          echo "BOOTLOADER_OFF=$BOOTLOADER_OFF"
          echo "PART_OFF=$PART_OFF"
          echo "APP_OFF=$APP_OFF"
        } >> "$GITHUB_ENV"

        echo ""
        echo "=== Final output files ==="
        ls -la output/
        echo "TOTAL:" $(du -sh output/ | cut -f1)
        echo ""
        echo "Single flash write command (0x0 only):"
        echo "esptool.py --chip esp32c3 write_flash 0x0 Top-AMS-full.bin"
        echo ""
        echo "Split flash write command:"
        echo "esptool.py --chip esp32c3 --flash_mode $FLASH_MODE --flash_freq $FLASH_FREQ --flash_size $FLASH_SIZE write_flash $BOOTLOADER_OFF bootloader.bin $PART_OFF partition-table.bin $APP_OFF Top-AMS.bin"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: Top-AMS-firmware-${{ env.DATE }}
        path: output/
        retention-days: 90
        if-no-files-found: error

    - name: Create / Update Latest Pre-release (push main only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest CI Build - ${{ env.DATE }}
        prerelease: true
        files: output/*
        generate_release_notes: true
        make_latest: true
        overwrite: true
        body: |
          ## 最新开发版固件 (自动构建)

          构建时间: ${{ env.DATE }}
          提交: ${{ github.sha }}

          本版本为 GitHub Actions 自动编译的最新主分支版本，包含最新功能和修复。

          ### 固件文件说明
          | 文件 | 说明 | 刷写地址 |
          |------|------|----------|
          | **Top-AMS-full.bin** | **推荐！单文件一键刷写** | 0x0 |
          | `bootloader.bin` | 引导加载程序 (拆分版) | ${{ env.BOOTLOADER_OFF }} |
          | `partition-table.bin` | 分区表 (拆分版) | ${{ env.PART_OFF }} |
          | `Top-AMS.bin` | 主程序固件 (拆分版) | ${{ env.APP_OFF }} |
          | `flash_args` / `flash_vars.txt` | 烧录参数参考 (以文件内容为准) | - |

          ### 🔥 推荐：一键单文件刷写
          ```bash
          esptool.py --chip esp32c3 --before default_reset --after hard_reset \
            write_flash 0x0 Top-AMS-full.bin
          ```

          ### 拆分版刷写 (需要3个文件)
          ```bash
          esptool.py --chip esp32c3 --before default_reset --after hard_reset write_flash \
            --flash_mode ${{ env.FLASH_MODE }} --flash_freq ${{ env.FLASH_FREQ }} --flash_size ${{ env.FLASH_SIZE }} \
            ${{ env.BOOTLOADER_OFF }} bootloader.bin \
            ${{ env.PART_OFF }} partition-table.bin \
            ${{ env.APP_OFF }} Top-AMS.bin
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Tagged Release (tag v* only)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: output/*
        generate_release_notes: true
        fail_on_unmatched_files: true
        body: |
          ## 正式发布版本 ${{ github.ref_name }}

          构建时间: ${{ env.DATE }}
          提交: ${{ github.sha }}

          ### 固件文件说明
          | 文件 | 说明 | 刷写地址 |
          |------|------|----------|
          | **Top-AMS-full.bin** | **推荐！单文件一键刷写** | 0x0 |
          | `bootloader.bin` | 引导加载程序 (拆分版) | ${{ env.BOOTLOADER_OFF }} |
          | `partition-table.bin` | 分区表 (拆分版) | ${{ env.PART_OFF }} |
          | `Top-AMS.bin` | 主程序固件 (拆分版) | ${{ env.APP_OFF }} |
          | `flash_args` / `flash_vars.txt` | 烧录参数参考 (以文件内容为准) | - |

          ### 🔥 推荐：一键单文件刷写
          ```bash
          esptool.py --chip esp32c3 --before default_reset --after hard_reset \
            write_flash 0x0 Top-AMS-full.bin
          ```

          ### 拆分版刷写 (需要3个文件)
          ```bash
          esptool.py --chip esp32c3 --before default_reset --after hard_reset write_flash \
            --flash_mode ${{ env.FLASH_MODE }} --flash_freq ${{ env.FLASH_FREQ }} --flash_size ${{ env.FLASH_SIZE }} \
            ${{ env.BOOTLOADER_OFF }} bootloader.bin \
            ${{ env.PART_OFF }} partition-table.bin \
            ${{ env.APP_OFF }} Top-AMS.bin
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
