name: Build Firmware

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Get current date
      id: date
      run: echo "DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.5.2
        target: esp32c3
        command: |
          pip install pyyaml jinja2
          idf.py build

    - name: Copy firmware files
      run: |
        mkdir -p output
        cp build/bootloader/bootloader.bin output/
        cp build/partition_table/partition-table.bin output/
        cp build/Top-AMS.bin output/
        cp build/flash_args output/
        echo "=== flash_args ==="
        cat output/flash_args

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Top-AMS-firmware-${{ env.DATE }}
        path: output/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: output/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
