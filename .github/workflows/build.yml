name: Build Firmware

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Get current date
      id: date
      run: echo "DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.5.2
        target: esp32c3
        command: |
          pip install pyyaml jinja2 esptool
          idf.py build 2>&1 || {
            echo "========= BUILD FAILED: printing detailed logs ========="
            find build/log -type f 2>/dev/null | head -20
            for f in build/log/idf_py_stderr_output_* build/log/idf_py_stdout_output_* build/CMakeFiles/CMakeError.log build/CMakeFiles/CMakeOutput.log; do
              [ -f "$f" ] || continue
              echo ""
              echo "===== $f ====="
              tail -n 400 "$f"
            done
            exit 1
          }

    - name: Setup Python + esptool for host runner
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install esptool on host
      run: pip install --upgrade esptool

    - name: Merge BINs into single flash image and prepare output
      run: |
        set -e
        mkdir -p output

        echo "=== Checking build output ==="
        ls -la build/ || true
        ls -la build/bootloader/ || true
        ls -la build/partition_table/ || true

        test -f build/bootloader/bootloader.bin || { echo "ERROR: bootloader.bin not found"; exit 1; }
        test -f build/partition_table/partition-table.bin || { echo "ERROR: partition-table.bin not found"; exit 1; }
        test -f build/Top-AMS.bin || { echo "ERROR: Top-AMS.bin not found"; exit 1; }
        test -f build/flash_args || { echo "ERROR: flash_args not found"; exit 1; }

        echo ""
        echo "=== flash_args ==="
        cat build/flash_args
        echo ""

        FLASH_MODE="dio"
        FLASH_FREQ="80m"
        FLASH_SIZE="4MB"
        line1=$(sed -n '1p' build/flash_args)
        echo "Parsed line: $line1"
        for tok in $line1; do
          case "$tok" in
            dio|qio|dout|qout) FLASH_MODE="$tok" ;;
            80m|40m|26m|20m)  FLASH_FREQ="$tok" ;;
            1MB|2MB|4MB|8MB|16MB|32MB|64MB|128MB) FLASH_SIZE="$tok" ;;
          esac
        done
        echo "Flash params: mode=$FLASH_MODE freq=$FLASH_FREQ size=$FLASH_SIZE"

        echo ""
        echo "=== Merging to single BIN ==="
        python -m esptool \
          --chip esp32c3 \
          merge_bin \
          -o output/Top-AMS-full.bin \
          --flash_mode "$FLASH_MODE" \
          --flash_freq "$FLASH_FREQ" \
          --flash_size "$FLASH_SIZE" \
          0x0 build/bootloader/bootloader.bin \
          0x8000 build/partition_table/partition-table.bin \
          0x10000 build/Top-AMS.bin

        cp build/bootloader/bootloader.bin output/
        cp build/partition_table/partition-table.bin output/
        cp build/Top-AMS.bin output/
        cp build/flash_args output/

        echo ""
        echo "=== Final output files ==="
        ls -la output/
        echo "TOTAL:" $(du -sh output/ | cut -f1)
        echo ""
        echo "Single flash write command (0x0 only):"
        echo "esptool.py --chip esp32c3 write_flash 0x0 Top-AMS-full.bin"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: Top-AMS-firmware-${{ env.DATE }}
        path: output/
        retention-days: 90
        if-no-files-found: error

    - name: Create / Update Latest Pre-release (push main only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest CI Build - ${{ env.DATE }}
        prerelease: true
        files: output/*
        generate_release_notes: true
        make_latest: true
        overwrite: true
        body: |
          ## 最新开发版固件 (自动构建)

          构建时间: ${{ env.DATE }}
          提交: ${{ github.sha }}

          本版本为 GitHub Actions 自动编译的最新主分支版本，包含最新功能和修复。

          ### 固件文件说明
          | 文件 | 说明 | 刷写地址 |
          |------|------|----------|
          | **Top-AMS-full.bin** | **推荐！单文件一键刷写** | 0x0 |
          | `bootloader.bin` | 引导加载程序 (拆分版) | 0x0 |
          | `partition-table.bin` | 分区表 (拆分版) | 0x8000 |
          | `Top-AMS.bin` | 主程序固件 (拆分版) | 0x10000 |
          | `flash_args` | 烧录参数参考 | - |

          ### 🔥 推荐：一键单文件刷写
          ```bash
          esptool.py --chip esp32c3 --before default_reset --after hard_reset \
            write_flash 0x0 Top-AMS-full.bin
          ```

          ### 拆分版刷写 (需要3个文件)
          ```bash
          esptool.py --chip esp32c3 --before default_reset --after hard_reset write_flash \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0x10000 Top-AMS.bin
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Tagged Release (tag v* only)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: output/*
        generate_release_notes: true
        fail_on_unmatched_files: true
        body: |
          ## 正式发布版本 ${{ github.ref_name }}

          构建时间: ${{ env.DATE }}
          提交: ${{ github.sha }}

          ### 固件文件说明
          | 文件 | 说明 | 刷写地址 |
          |------|------|----------|
          | **Top-AMS-full.bin** | **推荐！单文件一键刷写** | 0x0 |
          | `bootloader.bin` | 引导加载程序 (拆分版) | 0x0 |
          | `partition-table.bin` | 分区表 (拆分版) | 0x8000 |
          | `Top-AMS.bin` | 主程序固件 (拆分版) | 0x10000 |
          | `flash_args` | 烧录参数参考 | - |

          ### 🔥 推荐：一键单文件刷写
          ```bash
          esptool.py --chip esp32c3 --before default_reset --after hard_reset \
            write_flash 0x0 Top-AMS-full.bin
          ```

          ### 拆分版刷写 (需要3个文件)
          ```bash
          esptool.py --chip esp32c3 --before default_reset --after hard_reset write_flash \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0x10000 Top-AMS.bin
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
